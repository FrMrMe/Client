name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show repository files
        run: find . -path ./.git -prune -o -type f -print | head -60
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: |
          S=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$S" ]; then echo "settings.gradle NOT FOUND in repository"; exit 1; fi
          cd "$(dirname "$S")"
          gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hackclient-jar
          path: "**/build/libs/*.jar"
